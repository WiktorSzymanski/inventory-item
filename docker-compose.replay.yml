# Archive Prometheus for replayed benchmark runs.
#
#   COMPOSE_PROJECT_NAME=iir docker compose -f docker-compose.replay.yml up -d prometheus-replay
#
# Used STANDALONE, without `-f docker-compose.yml`. That file's api service declares
# `image: ${IMAGE_TAG:?...}` so a bare `docker compose up` cannot silently run whichever
# variant was last built — which also means merging it here fails on the missing variable,
# and it contributes nothing to this stack anyway. COMPOSE_PROJECT_NAME must match the
# benchmark stack's so prometheus-replay joins the same default network (`iir_default`)
# and Grafana can resolve it by container name.
#
# Deliberately NOT part of docker-compose.bench.yml: bench.sh must not start, stop or
# depend on it, and its volume is external so `docker compose down -v` leaves it alone.
services:
  prometheus-replay:
    image: prom/prometheus:v2.52.0
    container_name: prometheus-replay
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-replay.yml:/etc/prometheus/prometheus.yml:ro
      - bench-replay-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The archive must outlive the thesis. Default retention is 15d, which would silently
      # delete replayed runs anchored at 2026-01-01.
      - --storage.tsdb.retention.time=3650d
      - --storage.tsdb.retention.size=0
      - --web.enable-admin-api
      - --web.enable-lifecycle

  # Grafana lives in docker-compose.yml, which run-suite.sh tears down with `down -v` after
  # every run — so after a benchmark there is no Grafana to view anything in. This one makes
  # the replay stack self-contained: `up -d` here gives you both halves and needs nothing
  # from the benchmark stack.
  #
  # Separate container_name and port (3001, not 3000) so it can never collide with the
  # benchmark stack's Grafana. Both may run at once; :3000 is the live run, :3001 is the
  # archive. The same provisioning directory is mounted, so it carries the same dashboards
  # and both datasources — but with the benchmark stack down, the "Prometheus" datasource
  # has nothing to resolve and only "Prometheus Replay" will return data. That is expected.
  grafana-replay:
    image: grafana/grafana:11.0.0
    container_name: grafana-replay
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-replay-data:/var/lib/grafana
    depends_on:
      - prometheus-replay

volumes:
  bench-replay-data:
    external: true
  # Not external: this is only Grafana's own state (preferences, starred dashboards). The
  # dashboards and datasources come from provisioning on every start, so losing it costs
  # nothing. Keeping it out of the benchmark stack's grafana-data also means a `down -v`
  # there cannot disturb the archive viewer.
  grafana-replay-data:
