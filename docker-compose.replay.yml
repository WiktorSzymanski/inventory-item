# Archive Prometheus for replayed benchmark runs.
#
#   COMPOSE_PROJECT_NAME=iir docker compose -f docker-compose.replay.yml up -d prometheus-replay
#
# Used STANDALONE, without `-f docker-compose.yml`. That file's api service declares
# `image: ${IMAGE_TAG:?...}` so a bare `docker compose up` cannot silently run whichever
# variant was last built — which also means merging it here fails on the missing variable,
# and it contributes nothing to this stack anyway. COMPOSE_PROJECT_NAME must match the
# benchmark stack's so prometheus-replay joins the same default network (`iir_default`)
# and Grafana can resolve it by container name.
#
# Deliberately NOT part of docker-compose.bench.yml: bench.sh must not start, stop or
# depend on it, and its volume is external so `docker compose down -v` leaves it alone.
services:
  prometheus-replay:
    image: prom/prometheus:v2.52.0
    container_name: prometheus-replay
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-replay.yml:/etc/prometheus/prometheus.yml:ro
      - bench-replay-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The archive must outlive the thesis. Default retention is 15d, which would silently
      # delete replayed runs anchored at 2026-01-01.
      - --storage.tsdb.retention.time=3650d
      - --storage.tsdb.retention.size=0
      - --web.enable-admin-api
      - --web.enable-lifecycle

volumes:
  bench-replay-data:
    external: true
