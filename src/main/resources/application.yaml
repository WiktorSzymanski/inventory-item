spring:
  application:
    name: inventory-reservation
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    driver-class-name: org.postgresql.Driver
    hikari:
      # The pg-notify LISTEN session uses its own dedicated connection, not one from this pool.
      maximum-pool-size: ${DB_MAX_CONNECTIONS:50}  # max open DB connections in the pool
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    user: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    enabled: true
    locations: classpath:db/migration
  modulith:
    events:
      # Cadence of the SECOND delivery process. In cursor mode this stops being a crash backstop
      # and becomes the owner of every publication the drain's cursor advanced past — see
      # IncompleteEventRepublisher. Left at PT1M deliberately: outbox.sweep.rescued measures how
      # much work that actually is, and that number should decide the cadence, not a guess.
      republication-interval: ${OUTBOX_SWEEP_INTERVAL:PT1M}
      republication-min-age: ${OUTBOX_SWEEP_MIN_AGE:PT1M}   # min age before an incomplete publication is swept

app:
  outbox-cursor:
    # How the drain finds the next page.
    #
    # true  (CURSOR) — read `seq > cursor`, advance the cursor to the page's highest seq. The scan
    #                  starts past everything already delivered, so an idle drain costs one index
    #                  descent instead of walking the whole `completion_date IS NULL` region and its
    #                  tombstones. Rows the cursor moves past undelivered are swept by
    #                  IncompleteEventRepublisher.
    # false (SCAN)   — the pre-V8 behaviour every earlier TO-2 run measured.
    #
    # This is the A/B, and it is an env knob precisely so both modes run from ONE image: two builds
    # differ in more than the thing under test. PostgresNotificationListener logs the mode at
    # startup so a run cannot record the wrong one.
    enabled: ${OUTBOX_CURSOR_ENABLED:true}
  outbox-sweep:
    # Bounds on ONE sweep pass, in cursor mode. Strands are routine there, not rare, so the sweep
    # is a real delivery path and needs the same "one pass cannot run unboundedly long" guarantee
    # OutboxPurger has. Interval and min-age are the two spring.modulith.events.republication-*
    # keys above, left at PT1M until outbox.sweep.rescued says what the strand rate actually is.
    batch-size: ${OUTBOX_SWEEP_BATCH_SIZE:1000}           # publications per sweep page
    max-batches: ${OUTBOX_SWEEP_MAX_BATCHES:10}           # pages per sweep; caps one pass's duration
  event-delivery:
    threads: ${EVENT_DELIVERY_THREADS:20}                 # workers delivering a page; caps deliveries in flight
    batch-size: ${EVENT_DELIVERY_BATCH_SIZE:1000}         # publications per drain page; bounds a large backlog's fetch
  outbox-purge:
    # Deletes delivered publications so event_publication stops growing without bound. See
    # OutboxPurger — a delivered row has served the outbox guarantee and keeping it forever cost
    # this branch its capacity (352 MB against 134 MB of shared_buffers in a five-minute run).
    #
    # enabled=false is the controlled A/B: it reproduces the unbounded table growth WITHOUT
    # reverting V7, so a run can separate the autovacuum trigger's effect from the purge's.
    enabled: ${OUTBOX_PURGE_ENABLED:true}
    interval: ${OUTBOX_PURGE_INTERVAL:PT5S}               # sweep period
    # A DELIVERED row is needed by nobody, so this only has to exceed the delivery latency, not the
    # republisher's interval: IncompleteEventRepublisher selects on `completion_date IS NULL` and
    # never looks at completed rows. This was PT60S, mirroring republication-min-age below — but
    # that governs INCOMPLETE rows, so the mirror was wrong and expensive. Measured on
    # TO-2_capacity_W-base_20260819T222842Z, holding 60 s of delivered rows at ~3,500
    # publications/s puts ~210k rows of ballast under the table, which is what n_dead_tup peaking
    # at 318,866 was standing on. 5 s, with the 5 s sweep above, keeps only what is genuinely
    # in flight.
    min-age: ${OUTBOX_PURGE_MIN_AGE:PT5S}                 # how long a delivered row is kept
    batch-size: ${OUTBOX_PURGE_BATCH_SIZE:2000}           # rows per batch; each batch is ONE transaction
    # Hard bound, not a nicety. This runs on Spring's default scheduler pool — ONE thread, no
    # spring.task.scheduling section anywhere in this file — shared with OutboxMetrics (5 s) and
    # IncompleteEventRepublisher (1 min). An unbounded sweep would starve both.
    max-batches: ${OUTBOX_PURGE_MAX_BATCHES:10}           # batches per sweep; caps one sweep's duration
  order-worker:
    # 200 = the 150 worker + 50 retry threads this branch used to run, merged. This ONE pool runs
    # first attempts and retried attempts alike, so the branch has the same executing width and the
    # same connection demand as before while having half as many pools.
    #
    # DANGER: docker-compose pins ORDER_WORKER_THREADS=${ORDER_WORKER_THREADS:-150} for EVERY TO
    # branch, so this default does not survive a harness run — a run must export
    # ORDER_WORKER_THREADS=200 (variants.d/TO-2.env does it, if run-suite.sh sources it).
    # Left at 150 the branch is not broken, just 50 execution threads narrower than every run taken
    # before the merge, which is a resourcing difference dressed up as a topology result.
    # OrderWorkerConfig says so at startup.
    threads: ${ORDER_WORKER_THREADS:200}                   # the one pool: first attempts AND retries
    # INERT. The merged pool is a ScheduledThreadPoolExecutor and its DelayedWorkQueue is unbounded
    # by construction — which is what this default asked for anyway, so nothing a run relied on
    # changes. OrderWorkerConfig warns if it is set to anything else.
    queue-capacity: ${ORDER_WORKER_QUEUE_CAPACITY:2147483647}  # unbounded (Int.MAX_VALUE); absorb load like ES, no queue-full shedding

  # NO app.order-retry ON THIS BRANCH ANY MORE.
  #
  # There used to be a second pool here (`order-retry-*`, 50 threads) which served the backoff AND
  # executed the retried attempt, mirroring ES, where Axon's RetryingCallback dispatches inline onto
  # its own retry pool. No TO branch runs that topology now. Here the worker thread that failed the
  # attempt calls schedule() on its OWN pool and returns; the backoff is served in that pool's
  # DelayedWorkQueue — no thread, no connection — and when it comes due an order-worker thread runs
  # the attempt. It therefore also cannot park on the shared spring.task.scheduling pool, which
  # drains the outbox.
  #
  # docker-compose still exports ORDER_RETRY_THREADS and ORDER_RETRY_EXECUTE_ON_RETRY_POOL to every
  # TO branch. Both are INERT here: there is no second pool to size and no choice of where a retry
  # runs. OrderWorkerConfig says so at startup so a run cannot record them as settings it used.
  #
  # The nearest old configuration is ORDER_RETRY_EXECUTE_ON_RETRY_POOL=false, where the retry pool
  # only counted time and handed the attempt back. That still paid for a second pool and a
  # cross-pool hand-off; the queue POSITION a retry ends up in is the same either way, because a
  # DelayedWorkQueue orders by due time and treats a first attempt as a zero-delay task.

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        publish.lag: true
        outbox.write.time: true
        state_load_time: true
        state_persist_time: true
        order.processing.time: true
        order.queue.wait: true
        order.e2e.time: true
        order.retry.backoff.time: true   # accumulated backoff, one sample per retried order
      # order.e2e.time bounds are pinned explicitly — and must stay identical on every
      # variant branch. Micrometer's default Timer max is 30s; declaring
      # maximum-expected-value for publish.lag alone left order.e2e.time on that default,
      # so every sample above 30s collapsed into +Inf and histogram_quantile reported
      # ~30s — making a saturated TO run look FASTER than a healthy ES one, purely as a
      # bucketing artefact. Matches the ES branches exactly: 1ms to 10m.
      minimum-expected-value:
        order.e2e.time: 1ms
      maximum-expected-value:
        publish.lag: 10m
        order.e2e.time: 10m

server:
  port: 8080
  tomcat:
    threads:
      # 99, down from 200, and the same width TO-3 and ES-4-NullLock run so the families admit at
      # the same size. A POST runs the accept transaction ON the Tomcat thread, so every in-flight
      # POST holds a connection from the pool for its duration.
      max: ${HTTP_THREADS:99}         # threads answering HTTP requests
      # Literal, NOT ${HTTP_THREADS:16}: that spelling looks like a floor of 16 but actually pins
      # min-spare to whatever HTTP_THREADS is set to, so a sweep silently starts every thread up
      # front instead of raising a ceiling.
      min-spare: 16

springdoc:
  swagger-ui:
    path: /swagger-ui.html

