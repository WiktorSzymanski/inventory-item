spring:
  application:
    name: inventory-reservation
  # `spring.mongodb.*`, NOT `spring.data.mongodb.*`. Spring Boot 4.0 deprecated the old prefix
  # at ERROR level, which means it is no longer bound at all -- a URI written under it is read
  # by nothing and the driver silently falls back to mongodb://localhost:27017. That failure
  # looks like a network problem, not a configuration one.
  mongodb:
    # ONE client, and one pool, for the whole application -- both the Axon stores and the
    # Spring Data read models. ES-2 runs two Hikari pools (app 50 + axon 350) precisely so
    # Axon cannot starve the projections. A JDBC connection is pinned for the length of a
    # transaction while a MongoDB connection is checked out per operation and returned, so one
    # client suffices. maxPoolSize is therefore set to the SUM of ES-2's two pools, so the
    # database-side resource the two branches are given is the same number. The separation that
    # pool split protects is kept a different way -- see AxonConfig.axonTransactionManager,
    # which runs every storage operation in its OWN transaction rather than the command's.
    #
    # docker-compose supplies the whole URI including maxPoolSize (AXON_MONGO_POOL_SIZE,
    # default 400). The value below is the standalone/`bootRun` default and, like ES-2's
    # `axon.jdbc.pool.size: 300`, is NOT what runs under the harness.
    #
    # replicaSet is not optional. MongoTransactionManager cannot start a session against a
    # standalone mongod, and an Axon append spans several documents.
    uri: ${MONGO_URI:mongodb://localhost:27017/inventory?replicaSet=rs0&maxPoolSize=400}

axon:
  axonserver:
    enabled: false
  serializer:
    general: jackson
    events: jackson
    messages: jackson
  saga:
    # Segments are created at token init. reset.sh truncates token_entry with the API
    # stopped on every bench run, so a changed value takes effect on the next run with
    # no manual reset; a hand-run stack on a pre-existing volume keeps the old count.
    total-segments: ${AXON_SAGA_TOTAL_SEGMENTS:60}   # per-run override; 60 divides 2/3/4/5/6 replicas
    replicas: ${API_REPLICAS:1}     # must equal REPLICAS in .env; claim = ceil(total/replicas)
  mongo:
    pool:
      # Mirrors spring.mongodb.uri's maxPoolSize. It is read ONLY by
      # AxonCustomizerConfig.logPoolBudget, which warns when the resolved thread widths could
      # demand more connections than the pool holds -- the driver blocks on
      # waitQueueTimeoutMS rather than failing fast, and a stalled command is not a
      # ConcurrencyException, so ConcurrencyRetryScheduler will not retry it and it fails
      # terminally into the saga's abandon() path. That surfaces as latency and a rejection
      # rate, not as an error, which is why the budget is written down.
      #
      # CommandGatewayConfig sizes the command pool so peak demand is
      # 2 x (112 command + 60 saga + 3 projections) = 350 -- the SAME demand ES-2 makes, because
      # a busy thread still holds two: its command's transaction, and the event store's own
      # (AxonConfig.axonTransactionManager is PROPAGATION_REQUIRES_NEW, so a storage operation
      # suspends the command's transaction instead of joining it).
      #
      # 400 rather than ES-2's 350 because this ONE pool also serves the Spring Data read models,
      # which ES-2 gives a separate 50-connection Hikari pool. 350 + 50 = 400: same total.
      #
      # THE VALUE BELOW IS NOT WHAT RUNS: docker-compose builds the URI from
      # AXON_MONGO_POOL_SIZE, and Spring reads the pool size from the URI, not from here.
      size: 400
  # MongoTrackingToken has no gaps to track, so ES-2's max-gap-offset / gap-timeout-ms /
  # gap-cleaning-threshold have nothing to configure here and are deleted rather than carried
  # over dead. Those three exist on ES-2 because global_index is a non-transactional BIGSERIAL:
  # a rolled-back append burns a value and leaves a PERMANENT hole the token must remember, and
  # a lock-free write path makes such rollbacks ordinary rather than rare.
  #
  # look-back-time-ms is the closest thing this branch has to a CORRECTNESS knob of that class,
  # and it should be read with the same suspicion. A tracking processor advances its token to
  # the timestamp of the last event it saw and then re-reads this far back on the next poll, to
  # catch events whose write landed after it had already passed their timestamp. An event that
  # commits later than this window behind the token is skipped by that processor PERMANENTLY --
  # the same failure mode as an over-tight max-gap-offset, arrived at differently. 1000 ms is
  # the extension's own default. Treat a non-zero completion_ratio_inverse on ANY run here as a
  # reason to suspect this value first.
  eventstore:
    mongo:
      look-back-time-ms: 1000

snapshot:
  enabled: true
  event-count: 30

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        es.subscription.lag: true
        publish.lag: true
        projection.lag: true
        state_load_time: true
        state_persist_time: true
        inventory.optimistic.retry.duration: true
        order.e2e.time: true
        saga.lifetime: true
      # order.e2e.time bounds are pinned explicitly — and must stay identical on every
      # variant branch. Micrometer's default Timer max is 30s; TO-* only ever set
      # maximum-expected-value for publish.lag, so their order.e2e.time histogram clamped
      # every sample above 30s into +Inf and histogram_quantile reported ~30s for a
      # saturated run — making TO look faster than ES purely as a bucketing artefact.
      minimum-expected-value:
        order.e2e.time: 1ms
        saga.lifetime: 1ms
        # state_load_time had no floor of its own, so it inherited Micrometer's 1ms default
        # Timer minimum and le=0.001 became its FIRST bucket — every sample landed inside it,
        # and histogram_quantile interpolates the first bucket linearly from 0, so the panel
        # reported a constant q x 1ms (p50 500us, p95 950us) regardless of real latency.
        # 1us rather than 10us because the `replay` phase is in-memory handler dispatch and
        # can sit below 10us, which would reproduce the same artefact one decade down.
        # Measured cost: 68 -> 113 buckets per series.
        # Floor ONLY. The 30s default ceiling stays: capping it would clamp a slow cold
        # replay into +Inf and recreate the order.e2e.time artefact described above.
        state_load_time: 1us
      maximum-expected-value:
        projection.lag: 10m
        order.e2e.time: 10m
        saga.lifetime: 10m
events_applied_count: true

server:
  port: 8080
  tomcat:
    threads:
      # 99, down from Boot's default 200, and the same number TO-3 and the other NullLock variants
      # run so the families admit at the same width. This is NOT free headroom: the accept command
      # is dispatched with sendAndWait on the Tomcat thread and SimpleCommandBus handles it there,
      # so every in-flight POST holds two axon-jdbc-pool connections exactly as a command thread
      # does. CommandGatewayConfig's budget deliberately excludes these 99 — read its
      # RETRY_POOL_SIZE doc before changing this, because raising it is a POOL change that looks
      # like an admission-control one.
      #
      # accept-count stays at Boot's default 100: offered load beyond max threads queues there and
      # is REFUSED past it, surfacing as 502 from nginx rather than as backpressure. Check the 5xx
      # rate before reading a run as merely slow.
      max: ${HTTP_THREADS:99}
      # Literal, NOT ${HTTP_THREADS:16}: that spelling looks like a floor of 16 but actually pins
      # min-spare to whatever HTTP_THREADS is set to, starting every thread up front.
      min-spare: 16

springdoc:
  swagger-ui:
    path: /swagger-ui.html
