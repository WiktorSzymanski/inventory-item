spring:
  application:
    name: inventory-reservation
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    user: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    enabled: true
    locations: classpath:db/migration


management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        outbox.publish.lag: true
        inventory.optimistic.retry.duration: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

outbox:
  poll-interval-ms: 500
  batch-size: 10
