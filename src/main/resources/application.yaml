spring:
  application:
    name: inventory-reservation
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    user: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    enabled: true
    locations: classpath:db/migration


kurrentdb:
  connection-string: ${KURRENTDB_URL:kurrentdb://localhost:2113?tls=false}

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        es.subscription.lag: true
        publish.lag: true
        projection.lag: true
        state_load_time: true
        inventory.optimistic.retry.duration: true
      maximum-expected-value:
        projection.lag: 10m
events_applied_count: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
