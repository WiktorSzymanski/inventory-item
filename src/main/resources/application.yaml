spring:
  application:
    name: inventory-reservation
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    driver-class-name: org.postgresql.Driver
    hikari:
      # ONE flat pool for every path: HTTP reads, the accept transaction, the order workers, the
      # retry pool and the Modulith republisher all draw from it. The lane-routed two-pool split
      # (app-pool / write-pool) that this branch carried between 2026-08-15 and 2026-08-17 was
      # removed — see git history if the isolation argument is ever wanted back.
      #
      # 350 covers the write path with a lot of headroom: 99 tomcat (the accept tx runs ON the
      # Tomcat thread) + 50 order-worker + 1 republisher = 150 demanders, one connection each
      # because every handler is Propagation.REQUIRED. It was sized when the arithmetic read
      # 99 + 150 + 50 retry + 1 = 300; the retry pool is gone and the worker pool is 50, so the
      # margin is now wide rather than tight. Raising HTTP_THREADS or ORDER_WORKER_THREADS eats it;
      # nothing warns when it runs out, so the symptom is Hikari wait time rather than a message.
      maximum-pool-size: ${DB_MAX_CONNECTIONS:50}  # max open DB connections in the pool
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    user: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    enabled: true
    locations: classpath:db/migration
  modulith:
    events:
      republication-interval: PT30S  # how often the backup poller runs
      republication-min-age: PT1M    # minimum age before a PUBLISHED event is considered orphaned

app:
  outbox-purge:
    # Deletes delivered publications so event_publication stops growing without bound. See
    # OutboxPurger. The win is not the disk it frees: autovacuum's default trigger is
    # 50 + 0.2 * n_live_tup, so a big table tolerates enormous bloat before a vacuum, and the cost
    # of the incomplete-publication scan is a pure function of the dead entries piled in front of
    # it. Keeping the table small keeps vacuum aggressive. V7 attacks the same mechanism from the
    # other side by making that trigger absolute.
    #
    # enabled=false is the controlled A/B: it reproduces the unbounded table growth WITHOUT
    # reverting V7, so a run can separate the autovacuum trigger's effect from the purge's.
    enabled: ${OUTBOX_PURGE_ENABLED:true}
    interval: ${OUTBOX_PURGE_INTERVAL:PT5S}               # sweep period
    # A DELIVERED row is needed by nobody, so this only has to exceed the delivery latency, not the
    # republisher's interval: the republisher selects on `completion_date IS NULL` and never looks
    # at completed rows.
    min-age: ${OUTBOX_PURGE_MIN_AGE:PT5S}                 # how long a delivered row is kept
    batch-size: ${OUTBOX_PURGE_BATCH_SIZE:2000}           # rows per batch; each batch is ONE transaction
    # Bounds one sweep's duration however far behind the table has fallen. The sweep runs on
    # OutboxPurger's OWN thread, not the shared scheduler pool, so it never competes with delivery.
    max-batches: ${OUTBOX_PURGE_MAX_BATCHES:10}           # batches per sweep
  order-worker:
    # 50 = the width every benchmarked run has actually used. This ONE pool runs first attempts and
    # retried attempts alike, so the branch has one executing width and one connection demand where
    # it used to have a 150-thread worker pool and a 50-thread retry pool beside it.
    #
    # docker-compose.yml sets ORDER_WORKER_THREADS=${ORDER_WORKER_THREADS:-50} for EVERY TO branch,
    # and a compose default always SETS the variable, so it overrides the value below. The two now
    # AGREE, which is the whole point of this line: a bare `./gradlew bootRun` and a harness run get
    # the same pool. Change the harness width in docker-compose.yml — a branch still cannot express
    # a width the harness will honour, and OrderWorkerConfig logs the width it actually got at
    # startup, which is still the number to trust.
    #
    # THIS SHIPPED `200` UNTIL 2026-09-04 AND WAS DEAD TEXT FOR ALL OF IT. Compose has pinned 50
    # since 667d4e5, so every archived TO run was taken at 50 whatever this file claimed, and a
    # reader sizing an experiment off the yaml would have been wrong by 4x. The 200 was the
    # pre-merge 150 + 50 arithmetic carried forward; measured, it is not merely neutral but worse —
    # a pool that wide buys no throughput and adds inventory_state row-lock contention.
    threads: ${ORDER_WORKER_THREADS:50}                    # the one pool: first attempts AND retries
    # INERT. The merged pool is a ScheduledThreadPoolExecutor and its DelayedWorkQueue is unbounded
    # by construction — which is what this default asked for anyway, so nothing a run relied on
    # changes. OrderWorkerConfig warns if it is set to anything else.
    queue-capacity: ${ORDER_WORKER_QUEUE_CAPACITY:2147483647}  # unbounded (Int.MAX_VALUE); absorb load like ES, no queue-full shedding
  # THE SECOND POOL, AND THE ONLY THING THAT MAKES THIS BRANCH TO-3-parallel.
  #
  # The reserve path's MODIFY phase runs here instead of on the order-worker thread: an order's
  # lines are grouped by item and the groups reserve concurrently, so the phase costs about one
  # reserveDelayMs rather than ITEMS_PER_ORDER of them. See ReserveFanoutPool.
  #
  # 150 is affordable in a way an order-worker width of 150 would not be, and the reason is worth
  # keeping next to the number: THESE THREADS TAKE NO DATABASE CONNECTION AND HOLD NO ROW LOCK.
  # The modify phase runs outside the write transaction by construction, so this pool does not
  # draw on DB_MAX_CONNECTIONS at all and does not appear in the budget above. It costs memory —
  # ~150 platform thread stacks, tens of MB resident, and nothing while they are parked in
  # Thread.sleep.
  #
  # Sizing: peak demand is arrival_rate x ITEMS_PER_ORDER x reserveDelayMs x attempts. The widest
  # bench cell (W-fan/C01: 145 rps, 16 lines, 25 ms) needs 58 threads at one attempt and 290 at the
  # 5-attempt retry cap, so 150 covers every cell except a sustained worst case at W-fan — where
  # the overflow degrades to running inline on the order-worker thread rather than failing.
  #
  # docker-compose sets RESERVE_FANOUT_THREADS for every variant and it is inert on all of them but
  # this one. RESERVE_FANOUT_THREADS=1 is the useful degenerate setting: same image, near-sequential
  # execution, so it isolates the fan-out's own overhead from the parallelism.
  reserve-fanout:
    threads: ${RESERVE_FANOUT_THREADS:150}
    # BOUNDED, unlike the order pool's queue, and deliberately. On overflow the group runs on the
    # submitting order-worker thread — TO-3's behaviour exactly — which is a degradation you can
    # see in executor_queued_tasks and in the order pool's active count. An unbounded queue would
    # swallow the overflow silently and the parallelism would stop happening at precisely the load
    # it exists for.
    queue-capacity: ${RESERVE_FANOUT_QUEUE_CAPACITY:1000}
  # NO app.order-retry ON THIS BRANCH ANY MORE.
  #
  # There used to be a second pool here (`order-retry-*`, 50 threads) which served the backoff AND
  # executed the retried attempt, mirroring ES, where Axon's RetryingCallback dispatches inline onto
  # its own retry pool. Here the worker thread that failed the attempt calls schedule() on its OWN
  # pool and returns; the backoff is served in that pool's DelayedWorkQueue — no thread, no
  # connection — and when it comes due an order-worker thread runs the attempt. It therefore also
  # cannot park on the shared spring.task.scheduling pool, which drains the outbox.
  #
  # docker-compose still exports ORDER_RETRY_THREADS and ORDER_RETRY_EXECUTE_ON_RETRY_POOL to every
  # TO branch. Both are INERT here: there is no second pool to size and no choice of where a retry
  # runs. OrderWorkerConfig says so at startup so a run cannot record them as settings it used.
  #
  # The nearest old configuration is ORDER_RETRY_EXECUTE_ON_RETRY_POOL=false, where the retry pool
  # only counted time and handed the attempt back. That still paid for a second pool and a
  # cross-pool hand-off; the queue POSITION a retry ends up in is the same either way, because a
  # DelayedWorkQueue orders by due time and treats a first attempt as a zero-delay task.
  #
  # NO BRANCH CARRIES THE TWO-POOL RETRY TOPOLOGY ANY MORE — TO-1, TO-2, TO-3 and TO-4 all merged
  # it away, so there is nothing left to A/B it against in-tree. It is in the git history.

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        publish.lag: true
        outbox.write.time: true
        state_load_time: true
        state_persist_time: true
        order.processing.time: true
        order.queue.wait: true
        order.e2e.time: true
        order.retry.backoff.time: true   # accumulated backoff, one sample per retried order
      # order.e2e.time bounds are pinned explicitly — and must stay identical on every
      # variant branch. Micrometer's default Timer max is 30s; declaring
      # maximum-expected-value for publish.lag alone left order.e2e.time on that default,
      # so every sample above 30s collapsed into +Inf and histogram_quantile reported
      # ~30s — making a saturated TO run look FASTER than a healthy ES one, purely as a
      # bucketing artefact. Matches the ES branches exactly: 1ms to 10m.
      minimum-expected-value:
        order.e2e.time: 1ms
        # state_load_time had no floor of its own, so it inherited Micrometer's 1ms default
        # Timer minimum and le=0.001 became its FIRST bucket — every sample landed inside it,
        # and histogram_quantile interpolates the first bucket linearly from 0, so the panel
        # reported a constant q x 1ms (p50 500us, p95 950us) regardless of real latency.
        # 1us rather than 10us because the `replay` phase is in-memory handler dispatch and
        # can sit below 10us, which would reproduce the same artefact one decade down.
        # Measured cost: 68 -> 113 buckets per series.
        # Floor ONLY. The 30s default ceiling stays: capping it would clamp a slow cold
        # replay into +Inf and recreate the order.e2e.time artefact described above.
        state_load_time: 1us
      maximum-expected-value:
        publish.lag: 10m
        order.e2e.time: 10m

server:
  port: 8080
  tomcat:
    threads:
      # 99, down from 200, and the same width TO-1/TO-2/TO-4 and the ES *-NullLock branches run so
      # both families admit at the same size. This is admission control, not a residual: a POST runs
      # the accept transaction ON the Tomcat thread, so every in-flight POST holds a connection from
      # spring.datasource.hikari for its duration. Raising it eats the pool's headroom, and since
      # the split pool went away nothing recomputes or warns about that — see the note there.
      #
      # accept-count is left at Boot's default 100. Offered load beyond max threads queues there and
      # is REFUSED past it, which nginx surfaces as 502 and k6 reads as errors rather than as
      # backpressure. Deepening that queue is the knob behind the TO-2 open-loop collapse, so it
      # stays at the default deliberately — but check the 5xx rate before blaming a run on latency.
      max: ${HTTP_THREADS:99}         # threads answering HTTP requests
      # Literal, NOT ${HTTP_THREADS:16}: that spelling looks like a floor of 16 but actually pins
      # min-spare to whatever HTTP_THREADS is set to, so a sweep silently starts every thread up
      # front instead of raising a ceiling.
      min-spare: 16

springdoc:
  swagger-ui:
    path: /swagger-ui.html

