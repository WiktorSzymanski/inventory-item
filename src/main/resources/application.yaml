spring:
  application:
    name: inventory-reservation
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_CONNECTIONS:50}  # max open DB connections in the pool
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    user: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    enabled: true
    locations: classpath:db/migration
  modulith:
    events:
      republication-interval: PT30S  # how often the backup poller runs
      republication-min-age: PT1M    # minimum age before a PUBLISHED event is considered orphaned

app:
  order-worker:
    threads: ${ORDER_WORKER_THREADS:200}                   # worker pool processing accepted orders
    queue-capacity: ${ORDER_WORKER_QUEUE_CAPACITY:2147483647}  # unbounded by default (Int.MAX_VALUE); absorb load like ES, no queue-full shedding

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        publish.lag: true
        outbox.write.time: true
        state_load_time: true
        state_persist_time: true
        order.processing.time: true
        order.queue.wait: true
        order.e2e.time: true
      # order.e2e.time bounds are pinned explicitly — and must stay identical on every
      # variant branch. Micrometer's default Timer max is 30s; declaring
      # maximum-expected-value for publish.lag alone left order.e2e.time on that default,
      # so every sample above 30s collapsed into +Inf and histogram_quantile reported
      # ~30s — making a saturated TO run look FASTER than a healthy ES one, purely as a
      # bucketing artefact. Matches the ES branches exactly: 1ms to 10m.
      minimum-expected-value:
        order.e2e.time: 1ms
        # state_load_time had no floor of its own, so it inherited Micrometer's 1ms default
        # Timer minimum and le=0.001 became its FIRST bucket — every sample landed inside it,
        # and histogram_quantile interpolates the first bucket linearly from 0, so the panel
        # reported a constant q x 1ms (p50 500us, p95 950us) regardless of real latency.
        # 1us rather than 10us because the `replay` phase is in-memory handler dispatch and
        # can sit below 10us, which would reproduce the same artefact one decade down.
        # Measured cost: 68 -> 113 buckets per series.
        # Floor ONLY. The 30s default ceiling stays: capping it would clamp a slow cold
        # replay into +Inf and recreate the order.e2e.time artefact described above.
        state_load_time: 1us
      maximum-expected-value:
        publish.lag: 10m
        order.e2e.time: 10m

server:
  port: 8080
  tomcat:
    threads:
      max: ${HTTP_THREADS:200}        # threads answering HTTP requests
      min-spare: ${HTTP_THREADS:16}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

