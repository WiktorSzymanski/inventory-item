spring:
  application:
    name: inventory-reservation
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    user: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    enabled: true
    locations: classpath:db/migration

axon:
  axonserver:
    enabled: false
  serializer:
    general: jackson
    events: jackson
    messages: jackson
  saga:
    segments: 32
  jdbc:
    pool:
      size: 150
  # Tighten gap tracking so tokens don't accumulate the permanent gaps left by rolled-back appends
  # (see AxonConfig.eventStorageEngine). Defaults would be 10000 / 60000. Kept identical to
  # ES-3-optimistic so the two variants differ only in the aggregate lock.
  eventstore:
    max-gap-offset: 500
    gap-timeout-ms: 5000
    gap-cleaning-threshold: 250

snapshot:
  enabled: true
  event-count: 30

cache:
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        es.subscription.lag: true
        publish.lag: true
        projection.lag: true
        state_load_time: true
        state_persist_time: true
        inventory.optimistic.retry.duration: true
        order.e2e.time: true
      maximum-expected-value:
        projection.lag: 10m
        order.e2e.time: 10m
events_applied_count: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
