spring:
  application:
    name: inventory-reservation
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    driver-class-name: org.postgresql.Driver
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/inventory}
    user: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    enabled: true
    locations: classpath:db/migration

axon:
  axonserver:
    enabled: false
  serializer:
    general: jackson
    events: jackson
    messages: jackson

snapshot:
  enabled: false
  event-count: 50

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        es.subscription.lag: true
        publish.lag: true
        projection.lag: true
        state_load_time: true
        inventory.optimistic.retry.duration: true
      maximum-expected-value:
        projection.lag: 10m
events_applied_count: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
