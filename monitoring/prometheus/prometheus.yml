global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: inventory-es
    metrics_path: /actuator/prometheus
    # DNS service-discovery: resolves the `api-es` service name to every replica
    # IP so each `--scale`d instance is scraped as its own target/series
    # (instance label = <replica-ip>:8080).
    dns_sd_configs:
      - names: ['api-es']
        type: A
        port: 8080
        refresh_interval: 5s

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
