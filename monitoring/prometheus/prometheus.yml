global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: inventory
    metrics_path: /actuator/prometheus
    # A static target, not DNS discovery: the api service is a single container, so the
    # endpoint count no longer varies and the `instance` label reads `api:8080` instead
    # of a container IP.
    static_configs:
      - targets: ['api:8080']

  # Variants that give actuator its own connector (management.server.port) are scraped here
  # instead, and k6/bench/common.sh points their PROM_JOB at this job. A separate JOB rather
  # than a second target under `inventory`, because the validity gate is
  # `min(up{job="$JOB"})` -- a second target that is down on every other variant would fail
  # every one of their runs.
  #
  # Down, and expected to be down, on variants that serve actuator from the request pool.
  # Nothing queries this job for those runs.
  - job_name: inventory-mgmt
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:8090']

  # NOTE: the first scrape after mongodb-exporter starts returns `mongodb_up` and the FCV
  # gauge ONLY -- every collector needs one request to warm up. At a 5s interval the second
  # scrape is complete, and T0 is minutes after the stack comes up, so nothing a run reads is
  # affected. It matters if you ever curl :9216 by hand to check the exporter: scrape twice
  # before concluding a collector is missing.
  - job_name: mongo
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
