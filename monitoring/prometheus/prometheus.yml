global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: inventory-es
    metrics_path: /actuator/prometheus
    # Single-node variant: one static target, so the `instance` label stays the stable
    # `api-es:8080` rather than a container IP that changes on every recreate.
    # ES-3-pesimistic-scaling swaps this for dns_sd_configs to discover every replica.
    static_configs:
      - targets: ['api-es:8080']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
