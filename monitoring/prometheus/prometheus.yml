global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: inventory-es
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-es:8080']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: kurrentdb
    metrics_path: /metrics
    static_configs:
      - targets: ['kurrentdb:2113']
