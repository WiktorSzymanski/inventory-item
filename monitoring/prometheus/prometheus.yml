global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: inventory-es
    metrics_path: /actuator/prometheus
    # DNS discovery, not a static target: the api-es service is scaled with deploy.replicas,
    # so the number of endpoints behind the name varies. At REPLICAS=1 this resolves to
    # exactly one target, identical to the static config it replaces. The `instance` label
    # becomes a container IP rather than `api-es:8080` — harmless, because every expression
    # in queries.promql is sum()-wrapped.
    dns_sd_configs:
      - names: ['api-es']
        type: A
        port: 8080
        refresh_interval: 5s

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
