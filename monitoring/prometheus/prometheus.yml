global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: inventory
    metrics_path: /actuator/prometheus
    # A static target, not DNS discovery: the api service is a single container, so the
    # endpoint count no longer varies and the `instance` label reads `api:8080` instead
    # of a container IP.
    static_configs:
      - targets: ['api:8080']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
