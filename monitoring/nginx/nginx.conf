events {}

http {
    # Docker's embedded DNS. Using a variable in proxy_pass forces nginx to
    # re-resolve `api-to` per request instead of pinning to the IPs present at
    # startup, so it round-robins across every replica and survives replica
    # restarts. (A static `upstream` block would need commercial nginx
    # to re-resolve; hence no least_conn here — plain DNS round-robin.)
    resolver 127.0.0.11 valid=5s ipv6=off;

    access_log off;

    server {
        listen 8080;

        location / {
            set $backend "api-to";
            proxy_pass http://$backend:8080$request_uri;

            # Expose which replica served the request (handy for debugging LB spread)
            add_header X-Upstream $upstream_addr always;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
