# Custom postgres_exporter queries. Loaded via PG_EXPORTER_EXTEND_QUERY_PATH; see the
# postgres-exporter service in docker-compose.yml.
#
# WHY THIS FILE EXISTS. The stock v0.15.0 `locks` collector cannot report the lock that
# serialises NOTIFY-in-transaction commits, and the failure is silent. That lock is
#
#     locktype=object  classid=1262 (pg_database)  objid=0  mode=AccessExclusiveLock
#
# taken by LockSharedObject(DatabaseRelationId, ...) at pre-commit and held until after the
# commit's WAL fsync, so that queue entries land in commit order. It is a SHARED object, so
# pg_locks.database is 0 -- not NULL. The collector's query passes `WHERE database IS NOT NULL`
# (0 is not null) and then LEFT JOINs `ON pg_database.oid = tmp2.database`; no database has
# oid 0, so the whole group is dropped. Measured: 39 backends blocked on it while
# pg_locks_count{mode="accessexclusivelock"} read 0. Every archived run predates this file and
# therefore has a hole exactly where the evidence would be -- it cannot be backfilled.
#
# The two queries below are deliberately shaped differently; see the notes on each.

# One ungrouped aggregate, so it ALWAYS returns exactly one row and the gauge reads a true 0
# when nothing is waiting. A GROUP BY here would return no rows on an idle database and the
# series would vanish from the panel rather than reading zero. Do not "simplify" this into
# pg_wait below.
#
# No datname label, and none is possible: classid 1262 / objid 0 is one lock for the whole
# cluster. Never filter this metric by $db the way the other lock panels are filtered.
pg_notify_commit_lock:
  query: |
    SELECT
      count(*) FILTER (WHERE NOT granted) AS waiting,
      count(*) FILTER (WHERE granted)     AS held
    FROM pg_locks
    WHERE locktype = 'object' AND classid = 1262 AND objid = 0
  metrics:
    - waiting:
        usage: "GAUGE"
        description: "Backends waiting for the NOTIFY commit-serialization lock (pg_database object lock)"
    - held:
        usage: "GAUGE"
        description: "Backends holding the NOTIFY commit-serialization lock (0 or 1)"

# Independent corroboration that does not depend on trusting the classid above: a backend
# blocked on that lock reports wait_event_type='Lock', wait_event='object'. This one IS grouped,
# so its series legitimately disappear when nothing is waiting -- that is a gap on the panel,
# not a zero. `backend_type = 'client backend'` keeps autovacuum and the background writers out.
pg_wait:
  query: |
    SELECT wait_event_type AS type, wait_event AS event, count(*) AS backends
    FROM pg_stat_activity
    WHERE state = 'active' AND wait_event IS NOT NULL AND backend_type = 'client backend'
    GROUP BY 1, 2
  metrics:
    - type:
        usage: "LABEL"
        description: "wait_event_type"
    - event:
        usage: "LABEL"
        description: "wait_event"
    - backends:
        usage: "GAUGE"
        description: "Active client backends in this wait state"
