apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false

  # Archive of completed benchmark runs (the bench-replay-mongo volume). Only the Bench Runs
  # dashboard reads it; it is empty (and its panels error) unless docker-compose.replay.yml is up.
  # The live dashboard is pinned to `prometheus` above and never reaches this one.
  - name: Prometheus Replay
    type: prometheus
    uid: prometheus-replay
    url: http://prometheus-replay:9090
    access: proxy
    isDefault: false
    editable: false
