services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB:       inventory
      POSTGRES_USER:     inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 600 for EVERY variant, not per family. ES needs ~350 per replica (Hikari 50 +
    # Axon 300); TO needs ~50. max_connections sizes Postgres' shared memory, so a value
    # that differed between the families being compared was itself a confound — which the
    # old ES compose file warned about while the TO one used 300 anyway.
    #
    # track_io_timing is the only source of real DB I/O wait in this stack. With it off,
    # pg_stat_database_blk_read_time and blk_write_time increase by exactly 0 in every run —
    # which reads as "the database never waited on I/O", not as "not measured". It costs two
    # clock reads per block access; on a benchmark whose subject is storage-path cost, not
    # measuring the wait is the more expensive choice.
    command: postgres -c max_connections=${PG_MAX_CONNECTIONS:-600} -c track_io_timing=on
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    # No default tag. IMAGE_TAG is always set by the harness from variants.env; a default
    # here would let a bare `docker compose up` silently run whichever variant was baked in.
    image: ${IMAGE_TAG:?IMAGE_TAG must be set — use scripts/run-suite.sh}
    # One container, named, publishing :8080 straight to the host. The campaign is
    # single-node throughout, so there is no replica pool and nothing to load-balance;
    # the nginx that used to front this service only added a ~512-connection worker
    # ceiling to every measurement.
    #
    # container_name is what makes the single node structural rather than conventional:
    # Compose refuses to start a service that pins one at more than one replica.
    container_name: api
    environment:
      DB_JDBC_URL:         "jdbc:postgresql://postgres:5432/inventory"
      DB_R2DBC_URL:        "r2dbc:postgresql://postgres:5432/inventory"
      DB_USER:             inventory
      DB_PASSWORD:         inventory
      AXON_JDBC_POOL_SIZE: "${AXON_JDBC_POOL_SIZE:-350}"
      API_REPLICAS:        "1"
      # ES only (order-saga TrackingEventProcessor); ignored by the TO branches. Suite-wide
      # by necessity -- run-suite.sh has no per-variant env hook and a compose default always
      # SETS the variable, so vary it across passes:
      #     AXON_SAGA_TOTAL_SEGMENTS=8 scripts/run-suite.sh --only ES-4
      # Recorded in meta.json as saga_total_segments so runs stay distinguishable.
      AXON_SAGA_TOTAL_SEGMENTS: "${AXON_SAGA_TOTAL_SEGMENTS:-32}"
      # ES-4-bounded ONLY; every other variant binds it and ignores it. The size of the queue of
      # INCOMING sagas — how many not-yet-started orders may sit in front of an in-flight saga's
      # next step. Default 112 = that branch's command-pool width, i.e. one pool turn of new work;
      # sweep it DOWN to strengthen the bound:
      #     AXON_SAGA_INTAKE_CAPACITY=8 scripts/run-suite.sh --only ES-4,ES-4-bounded
      # Recorded in meta.json as saga_intake_capacity, since two runs of the same commit differ by
      # it. Unlike AXON_SAGA_TOTAL_SEGMENTS it needs no token reset — it is read at bean creation.
      AXON_SAGA_INTAKE_CAPACITY: "${AXON_SAGA_INTAKE_CAPACITY:-70}"
      # ES only (ES-2, ES-4 and the branches ported from them); every other variant binds it and
      # ignores it. The width of the `saga-command` pool — the ONLY execution lane on those
      # branches, since ConcurrencyRetryScheduler hands a retried command back to it instead of
      # running it on the retry thread. First attempts, retries and the saga's terminal
      # dispositions all execute here.
      #
      # IT MOVES THE CONNECTION BUDGET, which is why it is not a free knob. Each busy thread holds
      # two `axon-jdbc-pool` connections (its Spring transaction + one unjoined event-store
      # connection), so peak demand is 2 x (COMMAND_POOL + saga segment threads + 3 projections)
      # and the default 112 is chosen to consume AXON_JDBC_POOL_SIZE=350 exactly at
      # AXON_SAGA_TOTAL_SEGMENTS=60. Raising it without raising AXON_JDBC_POOL_SIZE (and
      # PG_MAX_CONNECTIONS with it) starves commands, and starvation does NOT fail cleanly: a
      # command stalls 5s on connectionTimeout and then fails TERMINALLY into the saga's abandon()
      # path, showing up as latency and rejections rather than errors. AxonCustomizerConfig logs
      # the resolved budget as [POOLS] at startup and warns when it exceeds the pool — read that
      # line on any run that sets this.
      #
      #     COMMAND_POOL=64 scripts/run-suite.sh --only ES-4
      #
      # Recorded in meta.json as command_pool, since two runs of the same commit differ by it.
      # Like AXON_SAGA_INTAKE_CAPACITY it needs no token reset — it is read at bean creation.
      COMMAND_POOL: "${COMMAND_POOL:-112}"
      # ES-2/ES-4 family ONLY (ES-2, ES-4, ES-4-bounded, and the mongo ports); every other variant
      # binds neither. The aggregate snapshot trigger: `snapshot.enabled` chooses
      # EventCountSnapshotTriggerDefinition over NoSnapshotTriggerDefinition, `snapshot.event-count`
      # is how many events pass before the next snapshot is written. Every branch that has it ships
      # `enabled: true` / `event-count: 30` in its own application.yaml.
      #
      # ES-1 HAS NEITHER, deliberately: no SnapshotProperties, no trigger bean, so every load there
      # is a full replay and that is the branch's identity. These variables reach its container and
      # change nothing. run-suite.sh warns via the `snapshot-trigger` capability in variants.env,
      # because that no-op is otherwise invisible — the run succeeds and only the numbers are wrong.
      #
      # BARE, unlike COMMAND_POOL above: a compose default always SETS the variable, so a `:-30`
      # here would override each branch's application.yaml and make the shipped value dead text.
      # Written bare, compose forwards these only when the host has them set.
      #
      #     SNAPSHOT_EVENT_COUNT=200 scripts/run-suite.sh --only ES-4   # rarer snapshots, longer tails
      #     SNAPSHOT_ENABLED=false   scripts/run-suite.sh --only ES-4   # ES-1's load path on ES-4
      #
      # The binding was VERIFIED on the inventory-reservation-es-4 image rather than assumed, since
      # a wrong variable name is exactly the silent no-op this knob exists to avoid: an invalid
      # value aborts startup with `Failed to bind properties under 'snapshot.event-count' ...
      # Origin: System Environment Property "SNAPSHOT_EVENT_COUNT"`, which also proves the env var
      # outranks application.yaml (SNAPSHOT_EVENTCOUNT binds identically; one spelling is enough).
      # Behaviourally, same image and 9 events on one aggregate: unset -> 0 rows in
      # snapshot_event_entry, event-count 2 -> a snapshot row at sequence 8.
      #
      # Read at bean creation, so like COMMAND_POOL it needs no token reset; reset.sh truncates
      # snapshot_event_entry between runs anyway. Recorded in meta.json as snapshot_enabled /
      # snapshot_event_count, since two runs of the same commit differ by them.
      SNAPSHOT_ENABLED:
      SNAPSHOT_EVENT_COUNT:
      POOLING_INTERVAL:    "${POOLING_INTERVAL:-PT0.1S}"
      CACHE_TTL:           "${CACHE_TTL:-10m}"
      CACHE_MAXIMUM_SIZE:  "${CACHE_MAXIMUM_SIZE:-10000}"
      DB_MAX_CONNECTIONS:  "${DB_MAX_CONNECTIONS:-350}"
      # 50 for every TO branch, down from 200.
      #
      # It has to be set HERE and cannot be expressed per branch: a compose default always SETS
      # the variable, so this line overrides whatever each branch's application.yaml says. As of
      # 2026-09-04 every TO branch also SHIPS 50, so the two finally agree and a reader can size an
      # experiment off either — before that they all shipped a `${ORDER_WORKER_THREADS:200}` that
      # was dead text under the harness, and no archived run recorded which width it used.
      #
      # Recorded in meta.json as order_worker_threads since 2026-09-04, so runs stay comparable
      # across a change to this line. Archives taken before then have no such field and were all
      # at 50 regardless.
      #
      # Inert on ES: no ES branch references order-worker or ORDER_WORKER at all, so this does
      # not resource the two families differently and is not a TO-vs-ES confound.
      ORDER_WORKER_THREADS: "${ORDER_WORKER_THREADS:-50}"
      # TO-3-parallel ONLY; every other variant binds neither and ignores both. The pool the
      # reserve path's MODIFY phase fans out across: an order's lines are grouped by item and the
      # groups reserve concurrently, so the phase costs about one reserveDelayMs instead of
      # ITEMS_PER_ORDER of them.
      #
      # IT DOES NOT MOVE THE CONNECTION BUDGET, and that is the point of the width. Unlike
      # COMMAND_POOL, whose every busy thread holds two axon-jdbc-pool connections, these threads
      # run entirely outside the write transaction — no Hikari connection, no row lock, nothing but
      # arithmetic and the artificial sleep. 150 of them cost ~150 platform thread stacks of memory
      # and no database resource at all, so DB_MAX_CONNECTIONS is unaffected and the TO connection
      # arithmetic (http 99 + workers 50 + delivery 100) is unchanged.
      #
      # Sizing: peak demand is arrival_rate x ITEMS_PER_ORDER x reserveDelayMs x attempts. The
      # widest cell (W-fan/C01: 145 rps, 16 lines, 25 ms) wants 58 threads at one attempt and 290
      # at the 5-attempt retry cap; past the width and the queue, a group runs inline on the
      # order-worker thread, which is TO-3's sequential behaviour rather than a failure.
      #
      #     RESERVE_FANOUT_THREADS=1 scripts/run-suite.sh --only TO-3-parallel
      #
      # is the useful degenerate setting: same image, near-sequential execution, so it isolates the
      # fan-out's own overhead from the parallelism. Both are recorded in meta.json.
      RESERVE_FANOUT_THREADS: "${RESERVE_FANOUT_THREADS:-150}"
      RESERVE_FANOUT_QUEUE_CAPACITY: "${RESERVE_FANOUT_QUEUE_CAPACITY:-1000}"
      HTTP_THREADS: "${HTTP_THREADS:-99}"
      # TO-1 and TO-2, and inert everywhere else (Spring ignores unknown properties). Selects how
      # the outbox drain finds its next page: CURSOR reads forward from a cursor, SCAN proves
      # absence over the whole `completion_date IS NULL` region. WHERE that cursor stops is a
      # second knob, app.outbox-cursor.watermark, which is NOT routed through compose: it defaults
      # true on TO-2 (stop at pg_snapshot_xmin) and does not exist on TO-1 (stop at the highest
      # `seq` seen). Set OUTBOX_CURSOR_WATERMARK=false on the host to run TO-2's seq arm. It has to be listed HERE — compose passes only
      # the variables it names, so an unlisted one never reaches the container and the A/B would
      # silently not happen. The default matches BOTH branches' application.yaml, so the usual
      # compose-default trap (a default always SETS the variable, overriding the branch's own yaml)
      # costs nothing here.
      #
      #   OUTBOX_CURSOR_ENABLED=false ./scripts/run-suite.sh --only TO-1   # pre-V8 baseline
      #   ./scripts/run-suite.sh --only TO-1                              # cursor
      #
      # Same commit, same image, both runs — which is the only way the comparison isolates the
      # drain topology instead of everything else that differs between two builds.
      #
      # The two branches differ in what SCAN means for the second delivery process: TO-2 falls back
      # to an unbounded republishing scan, TO-1's fallback poll switches off entirely, because
      # TO-1's scan drain already selects every incomplete row every tick. Both reproduce the
      # pre-V8 branch, which is the point.
      OUTBOX_CURSOR_ENABLED: "${OUTBOX_CURSOR_ENABLED:-true}"
      # Cadence of the fallback poll / republisher, on TO-1 and TO-2. NO `:-default` on purpose:
      # a compose default always SETS the variable and would override whatever the branch's own
      # application.yaml says. Written bare, compose forwards these only when the host has them
      # set, so an unset run keeps each branch's shipped default (PT1M/PT1M on both today) and a
      # run that wants to tune the sweep can still do it without a rebuild.
      OUTBOX_SWEEP_INTERVAL:
      OUTBOX_SWEEP_MIN_AGE:
      # Delivery pool width: 100 on TO-2 and TO-2-push, up from the 20 each of them ships. NOT
      # bare any more — a compose default overwrites the branch's own application.yaml, and here
      # that is the point: the two arms are meant to differ in HOW the drain finds its next page,
      # not in how wide it delivers, so the width belongs to the comparison rather than to any one
      # branch.
      #
      # Inert on TO-3 and TO-4, which have no drain pool at all (their @ApplicationModuleListener
      # deliveries run on SimpleAsyncTaskExecutor, one unbounded thread per task), and on ES.
      #
      # TO-1's equivalent pool is a DIFFERENT knob — see OUTBOX_POLLER_THREADS below.
      #
      # EVENT_DELIVERY_QUEUE_CAPACITY exists only on TO-2-push and is inert elsewhere. There the
      # NOTIFY carries the event, so the listener submits one delivery per notification and cannot
      # collapse a burst the way a wake-up does; that queue is the only thing bounding deliveries in
      # flight. Filling it blocks the listener, which backs up PostgreSQL's async-notify queue and
      # slows writers at pg_notify — so this knob sets where backpressure starts, and lowering it
      # moves the limit onto the producers sooner. Watch outbox_notify_queue_depth against it, and
      # outbox_notify_queue_usage for the server side.
      EVENT_DELIVERY_THREADS: "${EVENT_DELIVERY_THREADS:-100}"
      EVENT_DELIVERY_QUEUE_CAPACITY:
      # TO-1's delivery pool, and the counterpart to EVENT_DELIVERY_THREADS above: TO-1 polls
      # rather than listens, so its workers live under app.outbox-poller instead of
      # app.event-delivery and answer to this name. 100 for parity with the TO-2 arms — the
      # branch ships 10, which was never reachable from the harness because this variable was
      # not listed here at all, and compose forwards only the variables it names.
      #
      # Inert on every other branch.
      OUTBOX_POLLER_THREADS: "${OUTBOX_POLLER_THREADS:-100}"
    ports:
      - "8080:8080"
      # The management connector, on variants that give actuator its own port
      # (management.server.port). Published because k6/bench/common.sh health-checks from the
      # HOST; Prometheus reaches it over the compose network and needs no publish.
      #
      # Harmless on variants that do not set it: nothing listens, and nothing on the host
      # connects. 8090 rather than the conventional 8081, which is commonly taken.
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles:
      - load-test
    volumes:
      - ./k6:/scripts
      - ./reports:/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL:  "http://api:8080"
#      VUS:       "${VUS:-50}"
#      DURATION:  "${DURATION:-10m}"
    entrypoint: ["/bin/sh", "/scripts/run.sh"]
    depends_on:
      - grafana-reporter
      - api


  # ---------------------------------------------------------------- network delay
  # Datacenter RTT on the api -> postgres link, for runs that ask for one. OFF by default and
  # inert unless DB_NET_DELAY is set: the service sits behind a compose profile, so neither a
  # bare `docker compose up` nor bench.sh's `up -d postgres prometheus ...` starts it, and a run
  # that does not set the knob is byte-for-byte the stack that existed before this service did.
  #
  # WHY A SIDECAR rather than tc inside postgres: postgres:16-alpine ships no iproute2, and
  # baking one in would change the image under test. This container holds NET_ADMIN and joins
  # postgres' network namespace, so the qdisc it installs on eth0 IS postgres' egress qdisc. It
  # then sleeps, which is what lets bench.sh ask `exec netem tc qdisc show` what is actually in
  # force rather than assume the knob took.
  #
  # ONE-WAY, AND THAT IS THE POINT. netem shapes EGRESS only, so this delays postgres -> api and
  # leaves api -> postgres alone. A query round trip crosses it exactly once, which makes
  # DB_NET_DELAY the added RTT rather than one leg of it. Shaping the api side too would double
  # the figure and would also delay k6 -> api and Prometheus' scrapes -- neither of which is the
  # link being modelled.
  #
  # Reference RTTs: same rack 0.1-0.3ms, cross-AZ within a region 0.5-2ms, cross-region 10-100ms.
  # The compose bridge measures ~0.05-0.1ms before anything is added.
  #
  #     DB_NET_DELAY=500us scripts/run-suite.sh --only TO-1
  #     DB_NET_DELAY=2ms   scripts/run-suite.sh --only TO-1,ES-4
  #
  # Values are tc syntax (500us, 2ms, 10ms). Recorded in meta.json as db_net_delay, alongside the
  # qdisc read back from the namespace and the RTT measured either side of installing it.
  #
  # DB_NET_JITTER is empty by default and should usually stay that way. netem queues a jittered
  # packet by its computed send time, so a non-zero jitter REORDERS packets; TCP reads the
  # duplicate ACKs that follow as loss, halves cwnd and may fast-retransmit. That is a second
  # uncontrolled variable sitting on top of the latency being studied -- set it only when the
  # reordering is itself the subject.
  netem:
    # Pinned for the reason grafana/k6 is: `latest` drifting mid-campaign would change the
    # shaping between variants. Any image carrying iproute2 would do; this is simply one that is
    # guaranteed to.
    image: nicolaka/netshoot:v0.13
    container_name: netem
    profiles:
      - netem
    # Shares postgres' netns, so `eth0` in the command below is postgres' interface and not this
    # container's own. A service in this mode can declare no ports and no networks of its own.
    network_mode: "service:postgres"
    cap_add:
      - NET_ADMIN
    environment:
      DB_NET_DELAY:  "${DB_NET_DELAY:-}"
      DB_NET_JITTER: "${DB_NET_JITTER:-}"
    # `$$` escapes compose interpolation, so the inner shell expands these and not compose.
    #
    # The `del` first makes a restart idempotent. With DB_NET_DELAY empty NO qdisc is installed
    # at all, rather than a netem carrying `delay 0`: netem replaces the interface's default
    # qdisc with a 1000-packet queue of its own, so a "zero delay" arm would not be the unshaped
    # system and the A/B would be comparing two shaped ones.
    command:
      - sh
      - -c
      - |
        set -e
        tc qdisc del dev eth0 root 2>/dev/null || true
        if [ -n "$$DB_NET_DELAY" ]; then
          tc qdisc add dev eth0 root netem delay "$$DB_NET_DELAY" \
             $${DB_NET_JITTER:+$$DB_NET_JITTER distribution normal}
        fi
        tc qdisc show dev eth0
        exec sleep infinity
    depends_on:
      postgres:
        condition: service_healthy

  postgres-exporter:
    # Pin v0.15.0. PG_EXPORTER_EXTEND_QUERY_PATH is marked DEPRECATED by this build -- it works
    # here (verified: the custom gauges track pg_locks exactly at 10/30/60 concurrent notifiers,
    # and all 320 default metric lines still emit alongside them), but a later image could drop
    # it silently. If this pin is ever bumped, re-verify pg_notify_commit_lock_waiting appears
    # BEFORE trusting a run: its absence looks identical to "no contention".
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://inventory:inventory@postgres:5432/inventory?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /queries.yaml
    # Read once at exporter startup. Editing queries.yaml and reloading does NOTHING -- same trap
    # as prometheus.yml. After any edit: docker compose up -d --force-recreate postgres-exporter.
    volumes:
      - ./monitoring/postgres-exporter/queries.yaml:/queries.yaml:ro
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    # Report the machine root and real containers, nothing else.
    #
    # Without this, cadvisor also publishes every host cgroup it can walk — ~110 series for
    # systemd services and the desktop session, each carrying name="". That is not noise, it
    # is a hazard: for the whole 2026-08-22 campaign cadvisor never attributed a single cgroup
    # to a container (it stayed up, container_scrape_error stayed 0), and those host series
    # were what the container panels rendered instead. `name=~"$dbc|$apic"` with an unresolved
    # variable becomes name=~"|", which matches name="" exactly — so the panels filled with
    # whole-machine CPU and RSS and looked entirely plausible.
    #
    # With --docker_only a blind cadvisor emits `/` alone, which no panel can mistake for a
    # container, and k6/bench/bench.sh's cadvisor guard fails the run outright. The ~110
    # dropped series also come straight off every archived snapshot.
    command:
      - --docker_only=true
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-admin-api
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_RENDERING_SERVER_URL: "http://grafana-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    ports:
      - "8081:8081"
    environment:
      ENABLE_METRICS: "true"

  grafana-reporter:
    image: izakmarais/grafana-reporter:latest
    container_name: grafana-reporter
    ports:
      - "8686:8686"
    command: -proto http:// -ip grafana:3000
    depends_on:
      - grafana
      - grafana-renderer

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
