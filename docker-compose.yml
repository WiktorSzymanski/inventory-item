services:
  mongo:
    image: mongo:7
    container_name: mongo
    # --replSet is not optional and is not about replication. A MongoDB transaction can only be
    # started against a replica set, and the ES-*-mongo branches wire a MongoTransactionManager
    # because an Axon append writes several documents and has to be atomic across them. Against a
    # standalone mongod every command would fail at startTransaction. One member is enough for
    # that; this is a single-node stack throughout, exactly as the Postgres one is.
    #
    # --bind_ip_all because the replica set config below names the container by its compose
    # hostname, which is how the api reaches it.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      # Liveness only: this says mongod answers, NOT that the replica set is initiated. The
      # api waits on mongo-init below for that, because a healthy-but-uninitiated mongod
      # accepts a connection and then fails every transaction.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mongo-data:/data/db

  mongo-init:
    # One-shot, and idempotent: rs.status() throws only while the set is uninitiated, so a
    # restart against an existing mongo-data volume is a no-op rather than a reconfiguration.
    # It then blocks until a PRIMARY has actually been elected -- rs.initiate() returns before
    # the election completes, and an api that connects in that window sees no writable server.
    image: mongo:7
    container_name: mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo --quiet --eval '
          try { rs.status() }
          catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) }
          while (!db.hello().isWritablePrimary) { sleep(200) }
          print("rs0 primary ready")
        '

  mongodb-exporter:
    # The counterpart of postgres-exporter. --collect-all turns on the dbstats, collstats,
    # topmetrics and indexstats collectors; without it the exporter publishes serverStatus
    # alone and every per-collection panel is empty.
    #
    # --compatible-mode also emits the older mongodb_* names alongside the current ones. Left
    # ON deliberately: the metric names this exporter publishes are the one part of this stack
    # not pinned by anything in the repo, and a name that silently disappears reads as "the
    # database did nothing" rather than as an error -- the same hazard the postgres-exporter
    # pin documents. Re-verify with scripts/verify_dashboard_metrics.py before trusting a run
    # after any bump.
    image: percona/mongodb_exporter:0.53.0
    container_name: mongodb-exporter
    command:
      - --mongodb.uri=mongodb://mongo:27017/admin?directConnection=true
      - --collect-all
      - --compatible-mode
      - --discovering-mode
    ports:
      - "9216:9216"
    depends_on:
      mongo:
        condition: service_healthy

  api:
    # No default tag. IMAGE_TAG is always set by the harness from variants.env; a default
    # here would let a bare `docker compose up` silently run whichever variant was baked in.
    image: ${IMAGE_TAG:?IMAGE_TAG must be set — use scripts/run-suite.sh}
    # One container, named, publishing :8080 straight to the host. The campaign is
    # single-node throughout, so there is no replica pool and nothing to load-balance;
    # the nginx that used to front this service only added a ~512-connection worker
    # ceiling to every measurement.
    #
    # container_name is what makes the single node structural rather than conventional:
    # Compose refuses to start a service that pins one at more than one replica.
    container_name: api
    environment:
      # The whole datasource, in one string. maxPoolSize is spliced in rather than set
      # separately because Spring Boot 4 reads the pool size from the URI -- and note the
      # property the branches bind is `spring.mongodb.uri`, NOT `spring.data.mongodb.uri`,
      # which Boot 4 deprecated at ERROR level so that it binds nothing and the driver falls
      # back to localhost:27017.
      #
      # replicaSet=rs0 is required: MongoTransactionManager cannot start a session without it.
      #
      # 400 = the SUM of what the Postgres branches give their two Hikari pools (350 Axon +
      # 50 app), so the database-side resource the two families are handed is the same number.
      # One MongoClient serves both here because a Mongo connection is checked out per
      # operation rather than pinned for a transaction. Peak demand is unchanged at
      # 2 x (112 command + 60 saga + 3 projections) = 350 -- see CommandGatewayConfig on the
      # ES-*-mongo branches for why a busy thread still holds two.
      MONGO_URI:           "mongodb://mongo:27017/inventory?replicaSet=rs0&maxPoolSize=${AXON_MONGO_POOL_SIZE:-400}"
      API_REPLICAS:        "1"
      # ES only (order-saga TrackingEventProcessor); ignored by the TO branches. Suite-wide
      # by necessity -- run-suite.sh has no per-variant env hook and a compose default always
      # SETS the variable, so vary it across passes:
      #     AXON_SAGA_TOTAL_SEGMENTS=8 scripts/run-suite.sh --only ES-4
      # Recorded in meta.json as saga_total_segments so runs stay distinguishable.
      #
      # **32 HERE, 60 ON `main` -- AND THAT DIFFERENCE IS A CONFOUND UNTIL ONE SIDE MOVES.**
      # An ES-2 vs ES-2-mongo comparison is only a comparison of the STORE while everything
      # else is equal, and the segment count is not a small dial: `order-saga` is a
      # TrackingEventProcessor, so each segment opens its own tracking query over the whole
      # event stream. At 60 segments every appended event is read 63 times; at 32 it is read
      # 35 times. Measured on this branch at 60 (W-fast, 30 orders/s offered): the saga
      # association lookup ran at ~1753 queries/s against ~75 event-store reads/s and
      # dominated the run, while conflicts (~0.3/s) and the driver pool (65 of 400) were both
      # idle -- so this is the lever that moves throughput here, which is exactly why it must
      # not silently differ between the two harnesses.
      #
      # Before publishing any cross-store table, either run `main`'s ES-2/ES-4 with
      # AXON_SAGA_TOTAL_SEGMENTS=32 too, or set this back to 60. 32 is also the better value
      # on its own terms -- a power of two, so the 64-bucket hash mask spreads evenly, where
      # 60 gives segments 29-32 exactly double the load of the other 56.
      #
      # AxonCustomizerConfig logs the RESOLVED budget as [POOLS] at startup, so the run itself
      # always states what it used: 2 x (112 command + 32 saga + 3 projections) = 294 against
      # a 400 pool here, against 350/350 on `main`.
      AXON_SAGA_TOTAL_SEGMENTS: "${AXON_SAGA_TOTAL_SEGMENTS:-32}"
      # ES-4-bounded ONLY; every other variant binds it and ignores it. The size of the queue of
      # INCOMING sagas — how many not-yet-started orders may sit in front of an in-flight saga's
      # next step. Default 112 = that branch's command-pool width, i.e. one pool turn of new work;
      # sweep it DOWN to strengthen the bound:
      #     AXON_SAGA_INTAKE_CAPACITY=8 scripts/run-suite.sh --only ES-4,ES-4-bounded
      # Recorded in meta.json as saga_intake_capacity, since two runs of the same commit differ by
      # it. Unlike AXON_SAGA_TOTAL_SEGMENTS it needs no token reset — it is read at bean creation.
      #
      # INERT ON THIS BRANCH: variants.env registers only ES-2-mongo and ES-4-mongo, and
      # neither carries SagaIntakeGate — that bean lives on ES-4-bounded, which is registered
      # on `main`. The variable is still passed so the two compose files stay comparable, and
      # so an ES-4-bounded-mongo arm would need no harness change.
      AXON_SAGA_INTAKE_CAPACITY: "${AXON_SAGA_INTAKE_CAPACITY:-70}"
      POOLING_INTERVAL:    "${POOLING_INTERVAL:-PT0.1S}"
      CACHE_TTL:           "${CACHE_TTL:-10m}"
      CACHE_MAXIMUM_SIZE:  "${CACHE_MAXIMUM_SIZE:-10000}"
      HTTP_THREADS: "${HTTP_THREADS:-99}"
      # Every TO-only knob the Postgres harness carries -- ORDER_WORKER_THREADS,
      # OUTBOX_CURSOR_ENABLED, OUTBOX_SWEEP_*, EVENT_DELIVERY_*, OUTBOX_POLLER_THREADS -- is
      # deleted rather than left inert. variants.env on this branch registers the two
      # ES-*-mongo variants and nothing else, so there is no branch here that could honour one,
      # and a knob that silently does nothing is the thing this file's comments most often warn
      # about. Restore them from `main` if a TO-on-Mongo arm is ever added.
    ports:
      - "8080:8080"
      # The management connector, on variants that give actuator its own port
      # (management.server.port). Published because k6/bench/common.sh health-checks from the
      # HOST; Prometheus reaches it over the compose network and needs no publish.
      #
      # Harmless on variants that do not set it: nothing listens, and nothing on the host
      # connects. 8090 rather than the conventional 8081, which is commonly taken.
      - "8090:8090"
    depends_on:
      # service_completed_successfully, not service_healthy on mongo. A mongod that answers
      # ping but has no initiated replica set accepts the api's connection and then fails
      # every transaction, which surfaces as a health-check timeout with nothing in the logs
      # pointing at the cause.
      mongo-init:
        condition: service_completed_successfully

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles:
      - load-test
    volumes:
      - ./k6:/scripts
      - ./reports:/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL:  "http://api:8080"
#      VUS:       "${VUS:-50}"
#      DURATION:  "${DURATION:-10m}"
    entrypoint: ["/bin/sh", "/scripts/run.sh"]
    depends_on:
      - grafana-reporter
      - api


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    # Report the machine root and real containers, nothing else.
    #
    # Without this, cadvisor also publishes every host cgroup it can walk — ~110 series for
    # systemd services and the desktop session, each carrying name="". That is not noise, it
    # is a hazard: for the whole 2026-08-22 campaign cadvisor never attributed a single cgroup
    # to a container (it stayed up, container_scrape_error stayed 0), and those host series
    # were what the container panels rendered instead. `name=~"$dbc|$apic"` with an unresolved
    # variable becomes name=~"|", which matches name="" exactly — so the panels filled with
    # whole-machine CPU and RSS and looked entirely plausible.
    #
    # With --docker_only a blind cadvisor emits `/` alone, which no panel can mistake for a
    # container, and k6/bench/bench.sh's cadvisor guard fails the run outright. The ~110
    # dropped series also come straight off every archived snapshot.
    command:
      - --docker_only=true
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-admin-api
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_RENDERING_SERVER_URL: "http://grafana-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    ports:
      - "8081:8081"
    environment:
      ENABLE_METRICS: "true"

  grafana-reporter:
    image: izakmarais/grafana-reporter:latest
    container_name: grafana-reporter
    ports:
      - "8686:8686"
    command: -proto http:// -ip grafana:3000
    depends_on:
      - grafana
      - grafana-renderer

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
