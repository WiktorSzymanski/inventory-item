services:
  postgres-es:
    image: postgres:16-alpine
    container_name: postgres-es
    environment:
      POSTGRES_DB:       inventory
      POSTGRES_USER:     inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ~200 conns for the single API container (Hikari 50 + Axon 150). Kept at 300 to match the
    # other single-node variant branches — max_connections sizes Postgres' shared memory, so it
    # must not differ across branches being compared. The scaling branch raises this to 1000.
    command: postgres -c max_connections=300
    volumes:
      - postgres-es-data:/var/lib/postgresql/data

  api-es:
    image: inventory-reservation-es:latest
    # ES-3-pesimistic is the SINGLE-NODE variant: one container, owning host :8080 directly.
    # The multi-replica topology merged from ES-3-pesimistic-scaling lives on, but is not
    # wired up here — see monitoring/nginx/nginx.conf and the note in .env for how to switch.
    #
    # Why not just REPLICAS>1 on this branch: the k6 harness must stay byte-identical on every
    # variant branch, and k6/bench/reset.sh starts the API with `--no-deps` (so nginx would never
    # come up) and health-checks $HEALTH_URL on the published host port. Scaling therefore needs
    # nginx to own :8080, which is exactly what the scaling branch does.
    container_name: api-es
    environment:
      DB_JDBC_URL:         "jdbc:postgresql://postgres-es:5432/inventory"
      DB_R2DBC_URL:        "r2dbc:postgresql://postgres-es:5432/inventory"
      DB_USER:             inventory
      DB_PASSWORD:         inventory
      AXON_JDBC_POOL_SIZE: "${AXON_JDBC_POOL_SIZE:-150}"
      # Drives the saga per-node claim = ceil(total-segments / replicas). Must equal the
      # number of API containers actually running — 1 here.
      API_REPLICAS:        "${REPLICAS:-1}"
    ports:
      - "8080:8080"
    depends_on:
      postgres-es:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles:
      - load-test
    volumes:
      - ./k6:/scripts
      - ./reports:/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL:  "http://api-es:8080"
#      BASE_URL:  "http://nginx:8080"      # scaling topology: through the load balancer
#      BASE_URL:  "http://host.docker.internal:8080"
#      VUS:       "${VUS:-50}"
#      DURATION:  "${DURATION:-10m}"
    entrypoint: ["/bin/sh", "/scripts/run.sh"]
    depends_on:
      - grafana-reporter


  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://inventory:inventory@postgres-es:5432/inventory?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres-es:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-admin-api
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_RENDERING_SERVER_URL: "http://grafana-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    ports:
      - "8081:8081"
    environment:
      ENABLE_METRICS: "true"

  grafana-reporter:
    image: izakmarais/grafana-reporter:latest
    container_name: grafana-reporter
    ports:
      - "8686:8686"
    command: -proto http:// -ip grafana:3000
    depends_on:
      - grafana
      - grafana-renderer

volumes:
  postgres-es-data:
  prometheus-data:
  grafana-data:
