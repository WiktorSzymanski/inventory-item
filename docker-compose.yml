services:
  postgres-to:
    image: postgres:16-alpine
    container_name: postgres-to
    environment:
      POSTGRES_DB:       inventory
      POSTGRES_USER:     inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ~50 connections per replica on the TO family (Hikari only). 300 is the historical
    # single-node value that every existing result assumes; raise it in .env in step with
    # REPLICAS.
    command: postgres -c max_connections=${PG_MAX_CONNECTIONS:-300}
    volumes:
      - postgres-to-data:/var/lib/postgresql/data

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://inventory:inventory@postgres-to:5432/inventory?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres-to:
        condition: service_healthy

  api-to:
    image: inventory-reservation-to:latest
    # No container_name / no host port: this service is scaled via deploy.replicas, and both
    # would collide on the second replica. Replicas are reached inside the compose network
    # by the DNS name `api-to` (round-robin A records); nginx is the single published entry
    # point on host :8080.
    #
    # Scale with a SINGLE variable — do NOT pass --scale (mixing --scale with deploy.replicas
    # makes Compose remove middle replicas). Just:
    #   REPLICAS=4 docker compose up -d
    #
    # NOTE: at REPLICAS>1 Spring Modulith's republication poller runs on EVERY node, so
    # orphaned event_publication rows may be republished more than once. Scaling is wired
    # up here but not domain-verified — see the Scaling section of CLAUDE.md.
    environment:
      DB_JDBC_URL:   "jdbc:postgresql://postgres-to:5432/inventory"
      DB_R2DBC_URL:  "r2dbc:postgresql://postgres-to:5432/inventory"
      DB_USER:       inventory
      DB_PASSWORD:   inventory
      # Kept for parity with the ES family; the TO stack has no saga segments, so nothing
      # reads it today. It still records how many replicas the app believes are running.
      API_REPLICAS:        "${REPLICAS:-1}"
    expose:
      - "8080"
    deploy:
      replicas: ${REPLICAS:-1}
    depends_on:
      postgres-to:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8080:8080"          # single public entry point: host :8080 -> nginx -> api-to replicas
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-to

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles:
      - load-test
    volumes:
      - ./k6:/scripts
      - ./reports:/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL:  "http://nginx:8080"
#      BASE_URL:  "http://host.docker.internal:8080"
#      VUS:       "${VUS:-50}"
      DURATION:  "${DURATION:-5m}"
    entrypoint: ["/bin/sh", "/scripts/run.sh"]
    depends_on:
      - grafana-reporter
      - nginx

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_RENDERING_SERVER_URL: "http://grafana-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    ports:
      - "8081:8081"
    environment:
      ENABLE_METRICS: "true"

  grafana-reporter:
    image: izakmarais/grafana-reporter:latest
    container_name: grafana-reporter
    ports:
      - "8686:8686"
    command: -proto http:// -ip grafana:3000
    depends_on:
      - grafana
      - grafana-renderer

volumes:
  postgres-to-data:
  prometheus-data:
  grafana-data:
