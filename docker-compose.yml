services:
  kurrentdb:
    image: kurrentplatform/kurrentdb:latest
    container_name: kurrentdb
    environment:
      EVENTSTORE_CLUSTER_SIZE: 1
      EVENTSTORE_RUN_PROJECTIONS: All
      EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
      - "2113:2113"
    volumes:
      - kurrentdb-data:/var/lib/kurrentdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2113/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-es:
    image: postgres:16-alpine
    container_name: postgres-es
    environment:
      POSTGRES_DB:       inventory
      POSTGRES_USER:     inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-es-data:/var/lib/postgresql/data

  api-es:
    image: inventory-reservation-es:latest
    container_name: api-es
    environment:
      DB_JDBC_URL:    "jdbc:postgresql://postgres-es:5432/inventory"
      DB_R2DBC_URL:   "r2dbc:postgresql://postgres-es:5432/inventory"
      DB_USER:        inventory
      DB_PASSWORD:    inventory
      KURRENTDB_URL:  "kurrentdb://kurrentdb:2113?tls=false"
    ports:
      - "8080:8080"
    depends_on:
      postgres-es:
        condition: service_healthy
      kurrentdb:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles:
      - load-test
    volumes:
      - ./k6:/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL:  "http://api-es:8080"
#      BASE_URL:  "http://host.docker.internal:8080"
      VUS:       "${VUS:-10}"
      DURATION:  "${DURATION:-10m}"
    command: run /scripts/reserve-load-test.js
#    depends_on:
#      - api-es

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://inventory:inventory@postgres-es:5432/inventory?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres-es:
        condition: service_healthy

  kurrentdb-du:
    image: alpine:3.19
    container_name: kurrentdb-du
    volumes:
      - kurrentdb-data:/kurrentdb-data:ro
      - du-metrics:/metrics
    command:
      - sh
      - -c
      - |
        while true; do
          size=$$(du -sb /kurrentdb-data 2>/dev/null | cut -f1)
          echo "# HELP kurrentdb_data_size_bytes Disk space used by KurrentDB data directory" > /metrics/kurrentdb_du.prom
          echo "# TYPE kurrentdb_data_size_bytes gauge" >> /metrics/kurrentdb_du.prom
          echo "kurrentdb_data_size_bytes $$size" >> /metrics/kurrentdb_du.prom
          sleep 30
        done
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: node-exporter
    volumes:
      - du-metrics:/textfile-collector:ro
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile-collector
    ports:
      - "9100:9100"
    depends_on:
      - kurrentdb-du

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-es-data:
  kurrentdb-data:
  prometheus-data:
  grafana-data:
  du-metrics:
