services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB:       inventory
      POSTGRES_USER:     inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 600 for EVERY variant, not per family. ES needs ~350 per replica (Hikari 50 +
    # Axon 300); TO needs ~50. max_connections sizes Postgres' shared memory, so a value
    # that differed between the families being compared was itself a confound — which the
    # old ES compose file warned about while the TO one used 300 anyway.
    command: postgres -c max_connections=${PG_MAX_CONNECTIONS:-600}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    # No default tag. IMAGE_TAG is always set by the harness from variants.env; a default
    # here would let a bare `docker compose up` silently run whichever variant was baked in.
    image: ${IMAGE_TAG:?IMAGE_TAG must be set — use scripts/run-suite.sh}
    # One container, named, publishing :8080 straight to the host. The campaign is
    # single-node throughout, so there is no replica pool and nothing to load-balance;
    # the nginx that used to front this service only added a ~512-connection worker
    # ceiling to every measurement.
    #
    # container_name is what makes the single node structural rather than conventional:
    # Compose refuses to start a service that pins one at more than one replica.
    container_name: api
    environment:
      DB_JDBC_URL:         "jdbc:postgresql://postgres:5432/inventory"
      DB_R2DBC_URL:        "r2dbc:postgresql://postgres:5432/inventory"
      DB_USER:             inventory
      DB_PASSWORD:         inventory
      AXON_JDBC_POOL_SIZE: "${AXON_JDBC_POOL_SIZE:-350}"
      API_REPLICAS:        "1"
      POOLING_INTERVAL:    "${POOLING_INTERVAL:-PT0.1S}"
      CACHE_TTL:           "${CACHE_TTL:-10m}"
      CACHE_MAXIMUM_SIZE:  "${CACHE_MAXIMUM_SIZE:-10000}"
      DB_MAX_CONNECTIONS:  "${DB_MAX_CONNECTIONS:-350}"
      ORDER_WORKER_THREADS: "${ORDER_WORKER_THREADS:-200}"
      HTTP_THREADS: "${HTTP_THREADS:-99}"
      # TO-2 only, and inert everywhere else (Spring ignores unknown properties). Selects how the
      # outbox drain finds its next page: CURSOR reads `seq > cursor`, SCAN proves absence over the
      # whole `completion_date IS NULL` region. It has to be listed HERE — compose passes only the
      # variables it names, so an unlisted one never reaches the container and the A/B would
      # silently not happen. The default matches TO-2's application.yaml, so the usual
      # compose-default trap (a default always SETS the variable, overriding the branch's own yaml)
      # costs nothing here.
      #
      #   OUTBOX_CURSOR_ENABLED=false ./scripts/run-suite.sh --only TO-2   # pre-V8 baseline
      #   ./scripts/run-suite.sh --only TO-2                              # cursor
      #
      # Same commit, same image, both runs — which is the only way the comparison isolates the
      # drain topology instead of everything else that differs between two builds.
      OUTBOX_CURSOR_ENABLED: "${OUTBOX_CURSOR_ENABLED:-true}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles:
      - load-test
    volumes:
      - ./k6:/scripts
      - ./reports:/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL:  "http://api:8080"
#      VUS:       "${VUS:-50}"
#      DURATION:  "${DURATION:-10m}"
    entrypoint: ["/bin/sh", "/scripts/run.sh"]
    depends_on:
      - grafana-reporter
      - api


  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://inventory:inventory@postgres:5432/inventory?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-admin-api
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_RENDERING_SERVER_URL: "http://grafana-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    ports:
      - "8081:8081"
    environment:
      ENABLE_METRICS: "true"

  grafana-reporter:
    image: izakmarais/grafana-reporter:latest
    container_name: grafana-reporter
    ports:
      - "8686:8686"
    command: -proto http:// -ip grafana:3000
    depends_on:
      - grafana
      - grafana-renderer

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
